name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tests/CodexAgentPractice.Tests.csproj

      - name: Build
        run: dotnet build Tests/CodexAgentPractice.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet run --project Tests/CodexAgentPractice.Tests.csproj --configuration Release --no-build --no-restore
